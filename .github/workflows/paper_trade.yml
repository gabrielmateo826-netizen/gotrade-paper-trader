name: Dual Strategy Multi-Asset Paper Trader

on:
  schedule:
    # Runs Tuesday through Saturday at 21:05 UTC (5:05 AM Philippine Time, post-market close)
    - cron: '5 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full git history to prevent push rejection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Libraries
        run: |
          pip install --quiet yfinance pandas numpy tabulate

      - name: Execute Strategy Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tracker.py

      - name: Commit and Push Updated Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trades.csv README.md
          # Commits only if changes exist; cleanly skips if no changes occurred
          git commit -m "Automated Paper Log Update [$(date +'%Y-%m-%d')]" || echo "No trade changes to commit today."
          git pull --rebase origin main || true
          git push origin main || echo "Push skipped or already up to date."
